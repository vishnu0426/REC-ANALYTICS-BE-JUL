version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: AgnoCall
      POSTGRES_PASSWORD: AgnoCall
      POSTGRES_DB: AgnoCall
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U AgnoCall"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: AgnoCall
      MINIO_ROOT_PASSWORD: AgnoCall123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the audio bucket and wires a webhook notification
  # so MinIO calls the backend the instant a new object finishes uploading.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 AgnoCall AgnoCall123 &&
      mc mb --ignore-existing local/call-recordings &&
      mc admin config set local notify_webhook:pipeline endpoint='http://backend:8000/api/v1/internal/minio-webhook' &&
      mc admin service restart local &&
      sleep 3 &&
      mc event add local/call-recordings arn:minio:sqs::pipeline:webhook --event put --suffix .wav --suffix .mp3 --suffix .flac --suffix .m4a &&
      echo 'MinIO bucket + event notification configured.'
      "

  backend:
    build: ./backend
    # The image's own CMD (see backend/Dockerfile) is the production
    # command with no --reload; restore hot-reload for local compose dev.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://AgnoCall:AgnoCall@postgres:5432/AgnoCall
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: AgnoCall
      MINIO_SECRET_KEY: AgnoCall123
      MINIO_BUCKET: call-recordings
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEPLOYMENT_MODE: hybrid
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    # No -B here anymore — beat moved to worker-priority below. This worker
    # only consumes the heavy pipeline queues (gpu-heavy/cpu-io), so a
    # priority-reprocess task never has to wait behind a slow LLM/STT stage
    # on the same process; see worker-priority for why that used to happen.
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q gpu-heavy,cpu-io
    environment:
      DATABASE_URL: postgresql+psycopg://AgnoCall:AgnoCall@postgres:5432/AgnoCall
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: AgnoCall
      MINIO_SECRET_KEY: AgnoCall123
      MINIO_BUCKET: call-recordings
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEPLOYMENT_MODE: hybrid
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      - backend
    volumes:
      - ./backend:/app

  # Dedicated process for priority-reprocess: previously this queue was
  # consumed by the same worker process as gpu-heavy/cpu-io, so a slow
  # LLM-analysis task (10s+, see load-test results) blocked this worker from
  # picking up priority-reprocess tasks until it finished — queue depth hit
  # 11 pending under load. A separate process (separate OS scheduling, no
  # shared task slots) gives priority-reprocess actual isolation instead of
  # isolation-in-name-only. Also owns -B (Celery Beat) now: sync_call_records
  # enqueues onto this exact queue, so co-locating beat here keeps it fast
  # and out of the heavy worker's way. Low concurrency is enough — its tasks
  # are small/fast reprocess jobs, not LLM calls.
  worker-priority:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info -B -Q priority-reprocess --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://AgnoCall:AgnoCall@postgres:5432/AgnoCall
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: AgnoCall
      MINIO_SECRET_KEY: AgnoCall123
      MINIO_BUCKET: call-recordings
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEPLOYMENT_MODE: hybrid
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      - backend
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      # frontend/Dockerfile is now a multi-stage production build (final
      # stage only has the standalone server, no dev tooling); target the
      # `deps` stage here instead, which has node_modules installed but not
      # yet the built app, and run the dev server against the bind-mounted
      # source below — same local hot-reload workflow as before.
      target: deps
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pg_data:
  minio_data:
